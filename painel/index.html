<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
:root{
  --fundo:#04070d; --fundo2:#081120; --painel:rgba(10,22,40,.72); --borda:rgba(45,212,255,.16);
  --tema:#2dd4ff; --tema-forte:#00a6e6; --violeta:#8b7cff; --texto:#d9ecff; --suave:#7d93ae;
  --ok:#10b981; --atencao:#fbbf24; --erro:#ff5547; --info:#8a90a6;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 30% -10%,#0b2040 0%,var(--fundo) 60%) fixed,var(--fundo);
  color:var(--texto);font-family:var(--sans);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.oculto{display:none!important}

/* ---------- telas de boot e ativação ---------- */
.tela{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;background:var(--fundo);transition:opacity .6s ease;padding:16px;text-align:center}
.tela.saindo{opacity:0}
.logo{font-family:var(--mono);font-weight:800;font-size:clamp(46px,13vw,124px);letter-spacing:.22em;margin-right:-.22em;
  background:linear-gradient(90deg,var(--tema),var(--violeta));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(45,212,255,.35))}
.hr{width:min(520px,80vw);height:2px;border:0;background:linear-gradient(90deg,transparent,var(--tema),var(--violeta),transparent)}
.pisca-txt{font-family:var(--mono);letter-spacing:.35em;font-size:13px;color:var(--tema);animation:piscaTxt 1s steps(2) infinite}
.versao{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--suave)}
@keyframes piscaTxt{50%{opacity:.15}}
.btn-ativar{font-family:var(--mono);font-size:18px;letter-spacing:.25em;padding:16px 34px;border-radius:4px;cursor:pointer;
  background:rgba(45,212,255,.08);border:1px solid var(--tema);color:var(--tema);box-shadow:0 0 30px rgba(45,212,255,.25) inset,0 0 22px rgba(45,212,255,.2)}
.btn-ativar:hover{background:rgba(45,212,255,.16)}
.dica{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--suave)}

/* ---------- app ---------- */
#app{max-width:1500px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0 14px;border-bottom:1px solid var(--borda)}
.marca{font-family:var(--mono);font-weight:800;letter-spacing:.25em;font-size:20px;
  background:linear-gradient(90deg,var(--tema),var(--violeta));-webkit-background-clip:text;background-clip:text;color:transparent}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.18em;padding:4px 10px;border:1px solid var(--borda);border-radius:999px;color:var(--suave)}
.status.vivo{color:var(--tema);border-color:rgba(45,212,255,.5)}
.espaco{flex:1}
.grupo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:6px 10px;border-radius:6px;border:1px solid var(--borda);
  background:rgba(255,255,255,.02);cursor:pointer;white-space:nowrap}
.chip.ativo{border-color:var(--tema);color:var(--tema);background:rgba(45,212,255,.08)}
.chip:disabled{opacity:.4;cursor:default}
select.chip{max-width:190px}
.custo{font-family:var(--mono);font-size:11px;color:var(--suave)}
.aviso{margin:12px 0 0;padding:10px 14px;border-radius:8px;border:1px solid rgba(251,191,36,.45);background:rgba(251,191,36,.08);color:#ffe3a0;font-size:14px}
.aviso code{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:4px}

.grade{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:16px}
@media(min-width:1100px){.grade{grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}}
.caixa{background:var(--painel);border:1px solid var(--borda);border-radius:14px;backdrop-filter:blur(6px)}

/* orbe */
.palco{display:flex;flex-direction:column;align-items:center;padding:18px 16px 16px}
.orbe{position:relative;width:200px;height:200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.orbe .nucleo{position:absolute;inset:58px;border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#e9fbff 0%,var(--tema) 28%,#0a7fb8 62%,rgba(8,40,70,0) 72%);
  box-shadow:0 0 40px rgba(45,212,255,.7),0 0 90px rgba(45,212,255,.35)}
.orbe .anel{position:absolute;border-radius:50%;border:1px solid rgba(45,212,255,.45)}
.orbe .a1{inset:40px;border-style:dashed;animation:gira 18s linear infinite}
.orbe .a2{inset:22px;border-color:rgba(139,124,255,.35);border-top-color:var(--tema);animation:gira 9s linear infinite reverse}
.orbe .a3{inset:4px;border-color:rgba(45,212,255,.18)}
.orbe .onda{position:absolute;inset:58px;border-radius:50%;border:2px solid var(--tema);opacity:0}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes pulsoLento{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
@keyframes pulsoRapido{0%,100%{transform:scale(.94)}50%{transform:scale(1.1)}}
@keyframes onda{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.3);opacity:0}}
.orbe.ocioso .nucleo{animation:pulsoLento 4s ease-in-out infinite}
.orbe.ouvindo .nucleo{animation:pulsoLento 1.6s ease-in-out infinite}
.orbe.ouvindo .onda{animation:onda 1.6s ease-out infinite}
.orbe.ouvindo .o2{animation-delay:.53s}.orbe.ouvindo .o3{animation-delay:1.06s}
.orbe.pensando .nucleo{animation:pulsoRapido .55s ease-in-out infinite;filter:hue-rotate(35deg)}
.orbe.pensando .a1{animation-duration:2.4s}.orbe.pensando .a2{animation-duration:1.4s}
.orbe.falando .nucleo{animation:pulsoLento 1.1s ease-in-out infinite}
.orbe.falando .onda{animation:onda 2.6s ease-out infinite;border-width:1px}
.orbe.falando .o2{animation-delay:.86s}.orbe.falando .o3{animation-delay:1.72s}
.nome-assist{font-family:var(--mono);font-size:13px;letter-spacing:.5em;margin:8px 0 2px;color:var(--tema)}
.conversa{width:100%;margin-top:12px;display:grid;gap:8px}
.linha{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:baseline}
.linha span{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--suave)}
.linha p{margin:0;min-height:1.4em;overflow-wrap:anywhere}
.linha.jarvis p{color:#eaf7ff}
#formTexto{display:flex;gap:8px;margin-top:6px}
#formTexto input{flex:1;min-width:0;padding:11px 14px;border-radius:10px;border:1px solid var(--borda);background:rgba(0,0,0,.3);outline:none}
#formTexto input:focus{border-color:var(--tema)}
.atalhos{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

/* second brain */
.brain{margin-top:18px;padding:14px 14px 10px}
.brain-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brain-topo h2{margin:0;font-family:var(--mono);font-size:14px;letter-spacing:.18em}
.brain-topo .sub{color:var(--suave);font-size:12px}
.brain-topo .conta{font-family:var(--mono);font-size:12px;color:var(--suave)}
.btn-ic{width:30px;height:30px;border-radius:8px;border:1px solid var(--borda);background:rgba(255,255,255,.03);cursor:pointer;line-height:1}
.btn-ic:hover{border-color:var(--tema);color:var(--tema)}
#grafo{width:100%;margin-top:6px}
#grafo svg{display:block;width:100%;height:auto;overflow:visible}
#grafo .aresta{fill:none;stroke:url(#gradAresta);stroke-width:1.15;stroke-opacity:.5;stroke-dasharray:5 9;animation:desliza 7s linear infinite}
#grafo .raio{stroke-width:.7;stroke-opacity:.22}
#grafo .no{cursor:pointer}
#grafo .no text{fill:#cfe2f7;font-family:var(--sans);font-size:13px;text-anchor:middle;paint-order:stroke;stroke:#04070d;stroke-width:3px}
#grafo .no:hover text{fill:#fff}
#grafo .anel{fill:none;stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:respira 3.4s ease-in-out infinite}
#grafo .corpo{stroke:rgba(255,255,255,.55);stroke-width:1}
#grafo .no.pisca .corpo{animation:piscaNo .45s ease-in-out 8}
#grafo .core{transform-box:fill-box;transform-origin:center;animation:respira 2.8s ease-in-out infinite}
#grafo .pulso{fill:#fff}
@keyframes desliza{to{stroke-dashoffset:-140}}
@keyframes respira{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.28);opacity:.9}}
@keyframes piscaNo{50%{fill:#fff;stroke-width:6}}
.legenda{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:6px;font-size:12px;color:var(--suave)}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legenda .injetado{margin-left:auto;color:var(--ok);font-family:var(--mono);font-size:11px}

/* cards */
#alertas{padding:12px 14px}
#alertas h3{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--suave)}
#alertas ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
#alertas li{font-size:13px;cursor:pointer;overflow-wrap:anywhere}
#alertas li:hover{color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;margin-top:14px}
.card{padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.card .hora{margin-left:auto;font-size:11px;color:var(--suave);letter-spacing:0;text-transform:none}
.card .resumo{margin:0;color:#c3d6ec;font-size:14px}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.card li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:8px;font-size:13px;align-items:baseline}
.card li b{font-weight:600;color:#e6f3ff}
.card li span{overflow-wrap:anywhere}
.card .lista li{color:#b6c9df}
.card .mais{align-self:flex-start;font-size:12px;color:var(--tema);background:none;border:0;padding:0;cursor:pointer}
.card .links{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px}
.card a{color:var(--tema);text-decoration:none}.card a:hover{text-decoration:underline}
.card.erro{border-color:rgba(255,85,71,.45)}
.ponto{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;transform:translateY(-1px)}
.ponto.ok{background:var(--ok)}.ponto.atencao{background:var(--atencao)}.ponto.erro{background:var(--erro);box-shadow:0 0 8px var(--erro)}.ponto.info{background:var(--info)}

/* editor */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal form{width:min(520px,100%);padding:18px;display:grid;gap:10px;background:var(--fundo2)}
.modal h3{margin:0;font-family:var(--mono);letter-spacing:.15em;font-size:14px}
.modal label{display:grid;gap:4px;font-size:12px;color:var(--suave)}
.modal input,.modal select,.modal textarea{padding:9px 11px;border-radius:8px;border:1px solid var(--borda);background:rgba(0,0,0,.35);outline:none}
.modal textarea{min-height:120px;resize:vertical}
.modal .acoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .excluir{margin-right:auto;border-color:rgba(255,85,71,.5);color:#ff9a90}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="boot" class="tela">
  <div class="logo">JARVIS</div>
  <hr class="hr">
  <div class="pisca-txt">SINCRONIZANDO DADOS...</div>
  <div class="versao">v5.0 · REBUILD</div>
</div>

<div id="ativar" class="tela oculto">
  <div class="logo">JARVIS</div>
  <button id="btnAtivar" class="btn-ativar">► ATIVAR SISTEMA</button>
  <div class="dica">CLIQUE PARA INICIAR</div>
</div>

<div id="app" class="oculto">
  <header>
    <span class="marca">JARVIS</span>
    <span id="status" class="status">AGUARDANDO</span>
    <span class="espaco"></span>
    <div class="grupo" role="group" aria-label="Modo do cérebro">
      <button class="chip ativo" data-modo="rapido" title="Haiku 5.5: resposta rápida">RÁPIDO</button>
      <button class="chip" data-modo="profundo" title="Opus 5.5: pensa melhor">PROFUNDO</button>
    </div>
    <select id="selVoz" class="chip" aria-label="Voz"></select>
    <span id="custo" class="custo">API: US$ 0,0000</span>
    <div class="grupo">
      <button id="btnMic" class="chip" title="Liga e desliga o microfone">MIC</button>
      <button id="btnParar" class="chip" title="Interrompe a fala">PARAR</button>
      <button id="btnAtualizar" class="chip" title="Atualiza todos os dados agora">ATUALIZAR</button>
    </div>
  </header>
  <div id="aviso" class="aviso oculto"></div>

  <main class="grade">
    <section>
      <div class="caixa palco">
        <div id="orbe" class="orbe ocioso" title="Clique para falar">
          <div class="anel a3"></div><div class="anel a2"></div><div class="anel a1"></div>
          <div class="onda o1"></div><div class="onda o2"></div><div class="onda o3"></div>
          <div class="nucleo"></div>
        </div>
        <div class="nome-assist">JARVIS</div>
        <div class="conversa">
          <div class="linha voce"><span>VOCÊ</span><p id="falaVoce">…</p></div>
          <div class="linha jarvis"><span>JARVIS</span><p id="falaJarvis">…</p></div>
          <form id="formTexto" autocomplete="off">
            <input id="entrada" placeholder="ou digite e tecle Enter" aria-label="Pergunta">
          </form>
          <div class="atalhos">
            <button class="chip" data-cmd="resumo do dia">RESUMO DO DIA</button>
            <button class="chip" data-cmd="notícias">NOTÍCIAS</button>
            <button class="chip" data-cmd="como estão os custos da semana?">CUSTOS</button>
            <button class="chip" data-cmd="pensa melhor">PENSA MELHOR</button>
          </div>
        </div>
      </div>

      <div class="caixa brain">
        <div class="brain-topo">
          <h2>🧠 SECOND BRAIN</h2>
          <span class="sub">contexto da sua vida, lido em toda resposta</span>
          <span class="espaco"></span>
          <span id="conta" class="conta">0 notas · 0 áreas</span>
          <button id="btnNova" class="btn-ic" title="Nova nota" aria-label="Nova nota">+</button>
          <button id="btnRecarregar" class="btn-ic" title="Recarregar notas" aria-label="Recarregar notas">↻</button>
        </div>
        <div id="grafo"></div>
        <div id="legenda" class="legenda"></div>
      </div>
    </section>

    <section>
      <div id="alertas" class="caixa"></div>
      <div id="cards" class="cards"></div>
    </section>
  </main>
</div>

<div id="editor" class="modal oculto">
  <form id="formNota" class="caixa">
    <h3 id="editorTitulo">NOTA</h3>
    <label>Título<input id="notaTitulo" required maxlength="40"></label>
    <label>Área<select id="notaArea"></select></label>
    <label>Conteúdo<textarea id="notaCorpo"></textarea></label>
    <div class="acoes">
      <button type="button" id="notaExcluir" class="chip excluir">EXCLUIR</button>
      <button type="button" id="notaCancelar" class="chip">CANCELAR</button>
      <button type="submit" class="chip ativo">SALVAR</button>
    </div>
  </form>
</div>

<script>
"use strict";
// ---------- respostas da entrevista ----------
// As notas do Second Brain ficam em painel/notas.json (fora do git), servidas por /api/notas.
const CONFIG = {
  name: "Jarvis", address: "senhor", themeColor: "#2dd4ff", persona: "formal britânico (mordomo)",
  wakeWord: "ei jarvis", voiceGender: "masculina",
  model: { rapido: "claude-haiku-5-5", profundo: "claude-opus-5-5" }
};
const AREA = {
  metas: { label: "Metas", color: "#fbbf24" }, trabalho: { label: "Carreira", color: "#ff5547" },
  projetos: { label: "Projetos", color: "#8b7cff" }, financas: { label: "Finanças", color: "#f7931a" },
  aprendizado: { label: "Aprendizado", color: "#2dd4ff" }, saude: { label: "Saúde", color: "#10b981" },
  relacoes: { label: "Relações", color: "#ec4899" }, meta: { label: "Você", color: "#8a90a6" }
};
const ORDEM_AREAS = ["meta", "metas", "trabalho", "projetos", "financas", "aprendizado", "saude", "relacoes"];
const ORDEM_CARDS = ["tiktok", "instagram", "jesusepop", "custos", "agentes", "sites", "noticias"];
const VOZES_MASC = ["Reed", "Eddy", "Rocko", "Grandpa", "Felipe", "Daniel", "Ricardo", "Luiz"];
const WAKE = /\b(jarvis|jarbas|jarvas|djarvis|jarvi)\b/i;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^\w\s]/g, " ").replace(/\s+/g, " ").trim();
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lerGuardado = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

let notas = [], rel = [], estadoAtual = null;
let historico = [], ultimaPergunta = "";
let modo = lerGuardado("jarvis_modo") === "profundo" ? "profundo" : "rapido";
let busy = false, armado = false, tArmado = null, micLigado = false, escutando = false, rec = null;
let filaFala = [], falando = false, respostaAberta = false, fraseBuf = "", textoResp = "", abortCtl = null;
let vozes = [], voz = null;

// ---------- interface ----------
function setEstado(e) {
  $("#orbe").className = "orbe " + e;
  const st = $("#status");
  const rot = { ocioso: micLigado ? 'DIGA "EI JARVIS"' : "MIC DESLIGADO", ouvindo: "OUVINDO", pensando: "PENSANDO", falando: "FALANDO" }[e];
  st.textContent = rot;
  st.classList.toggle("vivo", e !== "ocioso");
}
const mostrarVoce = t => { $("#falaVoce").textContent = t; };
const setJarvis = t => { $("#falaJarvis").textContent = t || "…"; };
function aviso(html) { const a = $("#aviso"); if (!html) return a.classList.add("oculto"); a.innerHTML = html; a.classList.remove("oculto"); }
function atualizarMic() { $("#btnMic").classList.toggle("ativo", micLigado); $("#btnMic").textContent = micLigado ? "MIC ON" : "MIC OFF"; }
function atualizarModo() {
  document.querySelectorAll("[data-modo]").forEach(b => b.classList.toggle("ativo", b.dataset.modo === modo));
}
function atualizarCusto(usd) {
  $("#custo").textContent = "API: US$ " + (usd || 0).toFixed(4).replace(".", ",");
}

// ---------- voz: fala (TTS) ----------
function carregarVozes() {
  vozes = speechSynthesis.getVoices().filter(v => /^pt[-_]BR/i.test(v.lang));
  const salva = lerGuardado("jarvis_voz");
  voz = vozes.find(v => v.name === salva)
    || VOZES_MASC.map(n => vozes.find(v => v.name.startsWith(n))).find(Boolean)
    || vozes[0] || null;
  $("#selVoz").innerHTML = vozes.length
    ? vozes.map(v => `<option${v === voz ? " selected" : ""}>${esc(v.name)}</option>`).join("")
    : "<option>voz padrão</option>";
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = carregarVozes; carregarVozes(); }

function limparFala(t) {
  return String(t)
    .replace(/\[\[[\s\S]*$/, "")
    .replace(/US\$\s?([\d.,]+)/g, "$1 dólares").replace(/R\$\s?([\d.,]+)/g, "$1 reais")
    .replace(/[*#_`>~]/g, "").replace(/[\u2014\u2013]/g, ", ")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
    .replace(/\s+/g, " ").trim();
}
function falar(texto) {
  const t = limparFala(texto);
  if (!t || !("speechSynthesis" in window)) return;
  filaFala.push(t);
  if (!falando) proximaFala();
}
function proximaFala() {
  const t = filaFala.shift();
  if (t === undefined) { falando = false; if (!respostaAberta) finalizarTurno(); return; }
  falando = true; busy = true;
  pararEscuta(); setEstado("falando");
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "pt-BR"; if (voz) u.voice = voz; u.rate = 1.03; u.pitch = 0.88;
  u.onend = u.onerror = () => proximaFala();
  speechSynthesis.speak(u);
}
function extrairFrases() {
  // fala frase por frase enquanto a resposta ainda chega
  let m;
  while ((m = fraseBuf.match(/^([\s\S]*?[.!?…:;])\s+/))) {
    falar(m[1]);
    fraseBuf = fraseBuf.slice(m[0].length);
  }
}
function finalizarTurno() {
  busy = false;
  setEstado("ocioso");
  armar();          // janela pra continuar a conversa sem repetir a palavra de ativação
  iniciarEscuta();
}
function interromper() {
  filaFala = [];
  respostaAberta = false;
  if (abortCtl) abortCtl.abort();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  falando = false; busy = false;
  setEstado("ocioso");
  iniciarEscuta();
}

// ---------- voz: escuta (STT) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function criarRec() {
  if (!SR) { aviso("Este navegador não tem reconhecimento de voz. Use o Google Chrome, ou digite as perguntas."); return null; }
  const r = new SR();
  r.lang = "pt-BR"; r.continuous = true; r.interimResults = false;
  r.onresult = ev => {
    if (busy) return; // nunca processa o que ouviu enquanto pensa ou fala
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      if (ev.results[i].isFinal) ouvir(ev.results[i][0].transcript);
    }
  };
  r.onend = () => { escutando = false; if (micLigado && !busy) setTimeout(iniciarEscuta, 250); };
  r.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      micLigado = false; atualizarMic(); setEstado("ocioso");
      aviso("Microfone bloqueado. Clique no cadeado da barra de endereço, permita o microfone e recarregue a página. Enquanto isso, digite as perguntas.");
    }
  };
  return r;
}
function iniciarEscuta() {
  if (!rec || !micLigado || busy || escutando) return;
  try { rec.start(); escutando = true; } catch (e) { /* already started */ }
}
function pararEscuta() {
  if (!rec) return;
  try { rec.abort(); } catch (e) {}
  escutando = false;
}
function armar() {
  armado = true;
  if (!busy) setEstado(micLigado ? "ouvindo" : "ocioso");
  clearTimeout(tArmado);
  tArmado = setTimeout(() => { armado = false; if (!busy) setEstado("ocioso"); }, 8000);
}
function ouvir(txt) {
  const m = txt.match(WAKE);
  if (m) {
    const cmd = txt.slice(m.index + m[0].length).replace(/^[\s,.!?:;]+/, "");
    if (norm(cmd).length > 2) return comando(cmd);
    armar(); falar("Pois não, senhor?"); return;
  }
  if (armado) comando(txt);
}

// ---------- comandos ----------
async function comando(txt) {
  txt = String(txt).trim();
  if (!txt) return;
  armado = false; clearTimeout(tArmado);
  mostrarVoce(txt);
  const n = norm(txt);
  if (/^(para|pare|silencio|chega|cancela)\b/.test(n)) return interromper();
  if (/(resumo do dia|briefing|status geral|como estao (os )?(meus )?projetos)/.test(n)) return falarLocal("/api/briefing");
  if (/^(noticias|quais (sao )?as noticias|me (da|de) as noticias)/.test(n)) return falarLocal("/api/briefing?bloco=noticias");
  if (/atualiza(r)? (o )?painel/.test(n)) { await carregarEstado(true); return responderLocal("Painel atualizado, senhor."); }
  if (/^(pensa|pense) melhor$/.test(n) || /^(pensa|pense) melhor (nisso|nessa)$/.test(n)) {
    if (!ultimaPergunta) return responderLocal("Pois não, senhor. Qual é a pergunta?");
    // refaz a última pergunta no modo profundo
    if (historico.length && historico[historico.length - 1].role === "assistant") historico.pop();
    if (historico.length && historico[historico.length - 1].role === "user") historico.pop();
    return perguntar(ultimaPergunta, "profundo");
  }
  perguntar(txt, /(pensa|pense) melhor|analisa com calma/.test(n) ? "profundo" : modo);
}
function responderLocal(t) { setJarvis(t); respostaAberta = false; falar(t); }
async function falarLocal(rota) {
  busy = true; pararEscuta(); setEstado("pensando");
  try {
    const r = await fetch(rota); const d = await r.json();
    responderLocal(d.texto);
  } catch (e) { responderLocal("Senhor, não consegui ler o painel agora."); }
}
async function perguntar(txt, m) {
  busy = true; pararEscuta(); setEstado("pensando");
  ultimaPergunta = txt;
  historico.push({ role: "user", content: txt });
  textoResp = ""; fraseBuf = ""; setJarvis(m === "profundo" ? "pensando com calma…" : "…");
  respostaAberta = true;
  abortCtl = new AbortController();
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensagens: historico, modo: m }), signal: abortCtl.signal
    });
    const leitor = r.body.getReader(), dec = new TextDecoder();
    let resto = "";
    for (;;) {
      const { value, done } = await leitor.read();
      if (done) break;
      resto += dec.decode(value, { stream: true });
      let i;
      while ((i = resto.indexOf("\n\n")) >= 0) {
        const bloco = resto.slice(0, i); resto = resto.slice(i + 2);
        if (bloco.startsWith("data:")) tratar(JSON.parse(bloco.slice(5)));
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") tratar({ t: "erro", codigo: "local", msg: "Senhor, perdi a conexão com o servidor do painel." });
  } finally {
    if (!respostaAberta) return;
    respostaAberta = false;
    if (fraseBuf.trim()) { falar(fraseBuf); fraseBuf = ""; }
    if (!falando) finalizarTurno();
  }
}
function tratar(ev) {
  if (ev.t === "texto") {
    textoResp += ev.v; setJarvis(textoResp);
    fraseBuf += ev.v; extrairFrases();
  } else if (ev.t === "fim") {
    setJarvis(ev.texto);
    historico.push({ role: "assistant", content: ev.texto });
    atualizarCusto(ev.sessao_usd);
    if (ev.salvas && ev.salvas.length) carregarNotas().then(() => ev.salvas.forEach(piscar));
  } else if (ev.t === "erro") {
    historico.pop();
    setJarvis(ev.msg); fraseBuf = ""; falar(ev.msg);
    if (ev.codigo === "sem_chave") avisoChave();
  }
}
function avisoChave() {
  aviso("Falta a chave da API. Crie o arquivo <code>painel/.env</code> com a linha <code>ANTHROPIC_API_KEY=sua-chave</code> (pegue em console.anthropic.com) e reinicie o painel. Resumo do dia, notícias e os cards funcionam sem chave.");
}

// ---------- Second Brain: grafo ----------
let arestas = [], pulsos = [], animando = false;
function renderGrafo() {
  const cx = 500, cy = 262;
  const lista = [...notas].sort((a, b) => ORDEM_AREAS.indexOf(a.area) - ORDEM_AREAS.indexOf(b.area));
  const N = lista.length || 1, pos = {}, grau = {};
  rel.forEach(([a, b]) => { grau[a] = (grau[a] || 0) + 1; grau[b] = (grau[b] || 0) + 1; });
  lista.forEach((n, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / N, k = i % 2 ? 0.8 : 1;
    pos[n.id] = { x: cx + Math.cos(ang) * 405 * k, y: cy + Math.sin(ang) * 205 * k };
  });
  arestas = [];
  let sArestas = "", sRaios = "", sNos = "";
  rel.forEach(([a, b]) => {
    const A = pos[a], B = pos[b];
    if (!A || !B) return;
    const M = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    const C = { x: M.x + (cx - M.x) * 0.35, y: M.y + (cy - M.y) * 0.35 };
    arestas.push({ A, B, C });
    sArestas += `<path class="aresta" d="M${A.x.toFixed(1)},${A.y.toFixed(1)} Q${C.x.toFixed(1)},${C.y.toFixed(1)} ${B.x.toFixed(1)},${B.y.toFixed(1)}"/>`;
  });
  lista.forEach((n, i) => {
    const p = pos[n.id], cor = (AREA[n.area] || AREA.meta).color, r = 7 + Math.min(grau[n.id] || 0, 10) * 1.6;
    sRaios += `<line class="raio" x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke="${cor}"/>`;
    sNos += `<g class="no" data-id="${esc(n.id)}" transform="translate(${p.x.toFixed(1)},${p.y.toFixed(1)})">`
      + `<circle class="anel" r="${(r + 6).toFixed(1)}" stroke="${cor}" style="animation-delay:${(i * 0.23 % 3.4).toFixed(2)}s"/>`
      + `<circle class="corpo" r="${r.toFixed(1)}" fill="${cor}"/>`
      + `<text y="${(r + 17).toFixed(1)}">${esc(n.title)}</text><title>${esc(n.title)}: ${esc(n.body)}</title></g>`;
  });
  const defs = `<defs>
    <linearGradient id="gradAresta" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="540">
      <stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2dd4ff"/></linearGradient>
    <radialGradient id="gradCore"><stop offset="0" stop-color="#f1ecff"/><stop offset=".45" stop-color="#a78bfa"/><stop offset="1" stop-color="#5b21b6"/></radialGradient>
    <filter id="brilho" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="brilhoP" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;
  const core = `<circle class="core" cx="${cx}" cy="${cy}" r="40" fill="url(#gradCore)" filter="url(#brilho)"/>`
    + `<text x="${cx}" y="${cy + 10}" text-anchor="middle" font-size="28">🧠</text>`;
  let sPulsos = "";
  for (let i = 0; i < 12; i++) sPulsos += `<circle class="pulso" r="2.6" cx="-20" cy="-20" filter="url(#brilhoP)"/>`;
  // CRÍTICO: o <svg> inteiro vai como string no innerHTML de uma DIV, nunca no próprio <svg>
  $("#grafo").innerHTML = '<svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Grafo do Second Brain">'
    + defs + sRaios + sArestas + core + sNos + sPulsos + "</svg>";
  pulsos = [...document.querySelectorAll("#grafo .pulso")].map(el => ({
    el, e: Math.floor(Math.random() * Math.max(arestas.length, 1)), t: Math.random(), v: 0.0035 + Math.random() * 0.006
  }));
  const areas = [...new Set(notas.map(n => n.area))].sort((a, b) => ORDEM_AREAS.indexOf(a) - ORDEM_AREAS.indexOf(b));
  $("#legenda").innerHTML = areas.map(a => `<span><i style="background:${AREA[a].color}"></i>${AREA[a].label}</span>`).join("")
    + `<span class="injetado">✓ contexto injetado em todos os comandos do ${CONFIG.name}</span>`;
  $("#conta").textContent = `${notas.length} notas · ${areas.length} áreas`;
  if (!animando) { animando = true; requestAnimationFrame(animar); }
}
function animar() {
  if (!document.hidden && arestas.length) {
    for (const p of pulsos) {
      p.t += p.v;
      if (p.t >= 1) { p.t = 0; p.e = Math.floor(Math.random() * arestas.length); }
      const { A, B, C } = arestas[p.e] || arestas[0], t = p.t, u = 1 - t;
      p.el.setAttribute("cx", (u * u * A.x + 2 * u * t * C.x + t * t * B.x).toFixed(1));
      p.el.setAttribute("cy", (u * u * A.y + 2 * u * t * C.y + t * t * B.y).toFixed(1));
      p.el.setAttribute("opacity", Math.sin(Math.PI * t).toFixed(2));
    }
  }
  requestAnimationFrame(animar);
}
function piscar(id) {
  const g = document.querySelector(`#grafo .no[data-id="${CSS.escape(id)}"]`);
  if (!g) return;
  g.classList.remove("pisca"); void g.getBoundingClientRect(); g.classList.add("pisca");
  setTimeout(() => g.classList.remove("pisca"), 4000);
}
async function carregarNotas() {
  try {
    const d = await (await fetch("/api/notas")).json();
    notas = d.notas || []; rel = d.rel || [];
  } catch (e) { aviso("Não consegui ler as notas do Second Brain no servidor."); }
  renderGrafo();
}
async function gravarNotas() {
  const r = await fetch("/api/notas", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ notas, rel }) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.erro || "falha ao gravar");
  notas = d.notas; rel = d.rel; renderGrafo();
}

// ---------- editor de nota ----------
let editando = null;
$("#notaArea").innerHTML = ORDEM_AREAS.map(a => `<option value="${a}">${AREA[a].label}</option>`).join("");
function abrirEditor(id) {
  editando = id ? notas.find(n => n.id === id) : null;
  $("#editorTitulo").textContent = editando ? "EDITAR NOTA" : "NOVA NOTA";
  $("#notaTitulo").value = editando ? editando.title : "";
  $("#notaArea").value = editando ? editando.area : "projetos";
  $("#notaCorpo").value = editando ? editando.body : "";
  $("#notaExcluir").classList.toggle("oculto", !editando);
  $("#editor").classList.remove("oculto");
  $("#notaTitulo").focus();
}
const fecharEditor = () => $("#editor").classList.add("oculto");
$("#grafo").addEventListener("click", e => { const g = e.target.closest(".no"); if (g) abrirEditor(g.dataset.id); });
$("#btnNova").onclick = () => abrirEditor(null);
$("#btnRecarregar").onclick = carregarNotas;
$("#notaCancelar").onclick = fecharEditor;
$("#editor").addEventListener("click", e => { if (e.target.id === "editor") fecharEditor(); });
$("#notaExcluir").onclick = async () => {
  if (!editando || !confirm(`Excluir a nota "${editando.title}"?`)) return;
  const id = editando.id;
  notas = notas.filter(n => n.id !== id); rel = rel.filter(r => r[0] !== id && r[1] !== id);
  try { await gravarNotas(); fecharEditor(); } catch (e) { alert(e.message); }
};
$("#formNota").onsubmit = async e => {
  e.preventDefault();
  const title = $("#notaTitulo").value.trim(), area = $("#notaArea").value, body = $("#notaCorpo").value.trim();
  if (!title) return;
  if (editando) Object.assign(editando, { title, area, body });
  else {
    let base = norm(title).replace(/\s+/g, "-") || "nota", id = base, i = 2;
    while (notas.some(n => n.id === id)) id = `${base}-${i++}`;
    notas.push({ id, area, title, body });
    if (notas.some(n => n.id === "jesse")) rel.push(["jesse", id]);
    editando = { id };
  }
  const id = editando.id;
  try { await gravarNotas(); fecharEditor(); piscar(id); } catch (err) { alert(err.message); }
};

// ---------- cards dos projetos ----------
function estadoGeral(b) {
  if (!b || !b.ok) return "erro";
  const it = (b.dados && b.dados.itens) || [];
  if (it.some(i => i.estado === "erro")) return "erro";
  if (it.some(i => i.estado === "atencao")) return "atencao";
  return "ok";
}
const linkSeguro = u => /^https?:\/\//i.test(String(u || ""));
function renderCards(est) {
  const html = ORDEM_CARDS.filter(n => est.blocos[n]).map(n => {
    const b = est.blocos[n], g = estadoGeral(b);
    if (!b.ok) return `<article class="caixa card erro" id="card-${n}"><h3><span class="ponto erro"></span>${esc(n)}</h3>
      <p class="resumo">Sem dados agora: ${esc(b.erro)}</p></article>`;
    const d = b.dados || {}, hora = (b.atualizado || "").slice(11, 16);
    const itens = (d.itens || []).map(i => `<li><span class="ponto ${esc(i.estado || "info")}"></span><span><b>${esc(i.rotulo)}</b> ${esc(i.valor)}</span></li>`).join("");
    const lista = (d.lista || []).map((x, k) => {
      const txt = `${x.quando ? esc(x.quando) + " · " : ""}${esc(x.texto)}`;
      const corpo = linkSeguro(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener noreferrer">${txt}</a>` : txt;
      return `<li${k >= 5 ? ' class="extra oculto"' : ""}><span class="ponto ${esc(x.estado || "info")}"></span><span>${corpo}</span></li>`;
    }).join("");
    const mais = (d.lista || []).length > 5 ? `<button class="mais">ver mais ${(d.lista.length - 5)}</button>` : "";
    const links = (d.links || []).filter(l => linkSeguro(l.url))
      .map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.rotulo)} ↗</a>`).join("");
    return `<article class="caixa card" id="card-${n}">
      <h3><span class="ponto ${g}"></span>${esc(d.titulo || n)}<span class="hora">${esc(hora)}</span></h3>
      <p class="resumo">${esc(b.resumo)}</p>
      ${itens ? `<ul>${itens}</ul>` : ""}
      ${lista ? `<ul class="lista">${lista}</ul>${mais}` : ""}
      ${links ? `<div class="links">${links}</div>` : ""}
    </article>`;
  }).join("");
  $("#cards").innerHTML = html;
  const al = est.alertas || [];
  $("#alertas").innerHTML = al.length
    ? `<h3>${al.length} PONTOS DE ATENÇÃO</h3><ul>${al.slice(0, 8).map(a =>
        `<li data-bloco="${esc(a.bloco)}"><span class="ponto ${esc(a.estado)}"></span> ${esc(a.texto)}</li>`).join("")}</ul>`
    : `<h3><span class="ponto ok"></span> TUDO EM ORDEM</h3>`;
}
$("#cards").addEventListener("click", e => {
  const b = e.target.closest(".mais");
  if (!b) return;
  const card = b.closest(".card");
  card.querySelectorAll(".extra").forEach(li => li.classList.toggle("oculto"));
  b.textContent = b.textContent.startsWith("ver mais") ? "ver menos" : "ver mais";
});
$("#alertas").addEventListener("click", e => {
  const li = e.target.closest("li[data-bloco]");
  if (li) document.getElementById("card-" + li.dataset.bloco)?.scrollIntoView({ behavior: "smooth", block: "center" });
});
async function carregarEstado(forcar) {
  try {
    const r = await fetch("/api/estado" + (forcar ? "?forcar=1" : ""));
    estadoAtual = await r.json();
    renderCards(estadoAtual);
  } catch (e) {
    $("#cards").innerHTML = `<article class="caixa card erro"><h3><span class="ponto erro"></span>SERVIDOR</h3><p class="resumo">Não consegui falar com o servidor do painel.</p></article>`;
  }
}

// ---------- controles ----------
$("#formTexto").onsubmit = e => {
  e.preventDefault();
  const v = $("#entrada").value.trim();
  if (!v) return;
  $("#entrada").value = "";
  if (busy) interromper();
  comando(v);
};
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => { if (busy) interromper(); comando(b.dataset.cmd); });
document.querySelectorAll("[data-modo]").forEach(b => b.onclick = () => { modo = b.dataset.modo; guardar("jarvis_modo", modo); atualizarModo(); });
$("#selVoz").onchange = e => { voz = vozes.find(v => v.name === e.target.value) || voz; guardar("jarvis_voz", voz ? voz.name : ""); };
$("#btnParar").onclick = interromper;
$("#btnAtualizar").onclick = () => carregarEstado(true);
$("#btnMic").onclick = () => {
  micLigado = !micLigado; atualizarMic();
  if (micLigado) { if (!rec) rec = criarRec(); iniciarEscuta(); } else pararEscuta();
  setEstado("ocioso");
};
$("#orbe").onclick = () => {
  if (busy) return interromper();
  if (!micLigado) { micLigado = true; atualizarMic(); if (!rec) rec = criarRec(); }
  armar(); iniciarEscuta();
};

// ---------- inicialização ----------
carregarEstado(false);
carregarNotas();
fetch("/api/uso").then(r => r.json()).then(d => { atualizarCusto(d.custo_usd); if (!d.tem_chave) avisoChave(); }).catch(() => {});
setInterval(() => { if (!document.hidden) carregarEstado(false); }, 60000);
atualizarModo(); atualizarMic();

setTimeout(() => {
  $("#boot").classList.add("saindo");
  setTimeout(() => { $("#boot").classList.add("oculto"); $("#ativar").classList.remove("oculto"); }, 600);
}, 2200);

$("#btnAtivar").onclick = () => {
  // este clique é o gesto que libera microfone e áudio no navegador
  $("#ativar").classList.add("saindo");
  setTimeout(() => $("#ativar").classList.add("oculto"), 600);
  $("#app").classList.remove("oculto");
  renderGrafo();
  micLigado = true; atualizarMic();
  rec = criarRec();
  const n = estadoAtual ? (estadoAtual.alertas || []).length : 0;
  const saud = `Sistemas online. Estou ouvindo, ${CONFIG.address}.` + (n ? ` Há ${n} pontos de atenção no painel.` : "");
  setJarvis(saud);
  falar(saud);
  if (!("speechSynthesis" in window)) finalizarTurno();
};
